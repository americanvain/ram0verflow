name: ROFL node (pull requests)

# Accepts transactions submitted as pull requests, so contributors get the
# PR on their profile.
#
# SECURITY NOTE, and the reason this file is shaped the way it is:
# `pull_request_target` runs with a write token from the BASE repository. If
# it checked out the fork's branch and ran anything from it -- a build step,
# a dependency install, a test -- a stranger would be executing code with
# write access to this repo. That is the single most common way GitHub
# Actions get compromised.
#
# So this workflow never checks out the fork. It checks out main, reads the
# one submitted file through the API as inert text, validates it, and appends
# the transaction to main itself. The pull request is never merged, which
# also means concurrent submissions cannot conflict.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: rofl-chain
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out main, never the fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read the submitted file
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
                    --jq '.[] | "\(.status) \(.filename)"')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "changed files:"; printf '%s\n' "$files"

          if [ "$count" -ne 1 ]; then
            echo "reject=A transaction pull request must change exactly one file. This one changes $count." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status=$(printf '%s' "$files" | cut -d' ' -f1)
          path=$(printf '%s' "$files" | cut -d' ' -f2-)

          case "$path" in
            chain/pending/*)  ;;
            *) echo "reject=Only new files under \`chain/pending/\` are accepted. This changes \`$path\`." >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ "$status" != "added" ]; then
            echo "reject=\`$path\` must be a new file, not $status." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetched as inert text through the API. Nothing from the fork runs.
          gh api "repos/$REPO/contents/$path?ref=$SHA" --jq '.content' \
            | base64 -d > /tmp/submission.txt
          if [ "$(stat -c%s /tmp/submission.txt)" -gt 65536 ]; then
            echo "reject=Submission file is too large." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Validate and apply
        id: rofl
        if: steps.read.outputs.ok == 'true'
        env:
          COMMENT_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          COMMENT_BODY="$(cat /tmp/submission.txt)" python3 submit.py

      - name: Verify the whole chain still replays
        if: steps.rofl.outputs.changed == 'true'
        run: python3 verify.py

      - name: Commit
        if: steps.rofl.outputs.changed == 'true'
        run: |
          git config user.name  "rofl-node"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chain/ README.md assets/ 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "rofl: transaction from @${{ github.event.pull_request.user.login }} (#${{ github.event.pull_request.number }})"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash || exit 1
            python3 verify.py || exit 1
          done
          exit 1

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REJECT: ${{ steps.read.outputs.reject }}
          REPLY: ${{ steps.rofl.outputs.reply }}
        run: |
          if [ -n "$REJECT" ]; then
            printf '**Rejected.** %s\n' "$REJECT" > /tmp/reply.md
          elif [ -n "$REPLY" ]; then
            printf '%s\n' "$REPLY" >> /tmp/reply.md
            printf '\n\nThis pull request is closed rather than merged: the node applied your transaction to `main` directly, which is why concurrent submissions never conflict. Your contribution is recorded in the commit.\n' >> /tmp/reply.md
          else
            printf 'The node could not process this pull request.\n' > /tmp/reply.md
          fi
          gh pr comment "$PR" --body-file /tmp/reply.md
          gh pr close "$PR" || true
